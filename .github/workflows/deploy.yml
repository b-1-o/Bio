name: Deploy Bio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React Router SPA
        run: npm run build

      - name: Verify production output
        run: |
          test -f build/client/index.html
          test -d build/client/assets
          grep -q '/Bio/assets/' build/client/index.html
          if grep -q '/src/main.tsx' build/client/index.html; then
            echo 'ERROR: Vite source entry leaked into production build'
            exit 1
          fi
          echo 'React Router SPA output verified.'

      - name: Deploy static client to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/client
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
